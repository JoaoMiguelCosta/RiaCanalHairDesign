<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Metadados por rota (title, description, canonical, Open Graph, Twitter
       e JSON-LD na Home): gerados a partir de src/app/seo/routeMeta.js pelo
       plugin scripts/routeDocuments.js, que também emite termos.html,
       privacidade.html e 404.html no build. Não editar aqui. -->
  <!--route-head-->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- PWA / Icons -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#D59532" />
  <meta name="theme-color" content="#1C2431" />

  <!-- Hero (LCP): descoberta antecipada da imagem de fundo, só na Home.
       Este <link> nunca descarrega nada (media="not all"); existe para o Vite
       lhe resolver o URL final com hash. O script seguinte cria o preload real
       apenas quando a rota inicial é "/" (as páginas legais e o 404 não usam o
       Hero). -->
  <link id="hero-preload" rel="preload" as="image" type="image/avif" media="not all"
    href="/src/content/media/hero/hero-1920.avif" />
  <script>
    (function () {
      var src = document.getElementById("hero-preload");
      if (!src || location.pathname !== "/") return;
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.type = "image/avif";
      link.setAttribute("fetchpriority", "high");
      link.href = src.href;
      document.head.appendChild(link);
    })();
  </script>

  <!-- Fontes: servidas pelo próprio domínio (@font-face em
       src/app/styles/global.css), sem pedidos a serviços externos. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.jsx"></script>
</body>

</html>
